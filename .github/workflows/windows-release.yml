name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Run headless checks
        run: dotnet run --project tests/CameraInfo.Checks.csproj -c Release
      - name: Publish self-contained executable
        run: |
          dotnet publish CameraInfo.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None --source https://api.nuget.org/v3/index.json -o dist/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $files = @(Get-ChildItem -LiteralPath dist/win-x64)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'CameraInfo.exe') {
            throw 'Expected one executable in the publish directory.'
          }
          Rename-Item -LiteralPath dist/win-x64/CameraInfo.exe -NewName CameraInfo-win-x64.exe
          Get-FileHash -LiteralPath dist/win-x64/CameraInfo-win-x64.exe -Algorithm SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CameraInfo-win-x64
          path: dist/win-x64/CameraInfo-win-x64.exe
          if-no-files-found: error
