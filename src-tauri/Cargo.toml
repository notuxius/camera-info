
[package]
name = "camera-inspector"
version = "0.10.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Devices_PortableDevices", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
cc = "1"
tauri-build = "2"

[[bin]]
name = "camera-inspector"
path = "src/main.rs"
required-features = ["desktop"]
