
name: Camera Inspector Tauri checks

on:
  push:
    branches: ['codex/tauri-migration', master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup update stable
      - name: Check ImageCaptureCore bridge
        if: runner.os == 'macOS'
        run: xcrun clang -fobjc-arc -fsyntax-only src/mac_camera.m
      - name: Run headless camera checks
        run: cargo +stable test --no-default-features --lib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.runner == 'windows-2025'
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
